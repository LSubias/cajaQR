<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Caja QR{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script type="module" src="{{ url_for('static', filename='app.js') }}"></script>
</head>
<body>
  <header class="top"><strong>Caja QR</strong>
    {% block header_actions %}{% endblock %}
    {% if g.user and request.endpoint != 'buyer' %}
    <nav aria-label="Principal">
      <a href="/" {% if request.endpoint == 'register' %}aria-current="page"{% endif %}>Caja</a>
      <a href="/stock" {% if request.endpoint == 'inventory' %}aria-current="page"{% endif %}>Stock</a>
      <a href="/ventas" {% if request.endpoint == 'sales_page' %}aria-current="page"{% endif %}>Ventas</a>
    </nav>
    <span class="operator-name">{{ g.user.username }}</span>
    <form action="/salir" method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button class="plain">Salir</button></form>
    {% endif %}
  </header>
  {% block content %}{% endblock %}
</body>
</html>
