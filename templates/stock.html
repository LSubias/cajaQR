{% extends "base.html" %}
{% block content %}
<main data-page="stock">
  <a class="back-link" href="/">← Volver a Caja</a>
  <h1>Stock</h1>
  <p id="message" role="status"></p>
  <section class="panel stack">
    <h2>Categorías</h2>
    {% if g.user.role == "admin" %}
    <form id="category-form" class="category-form">
      <label>Nueva categoría <input name="categoryName" maxlength="48" required></label>
      <button>Crear categoría</button>
    </form>
    {% endif %}
    <div id="category-list" class="category-list" role="group" aria-label="Filtrar inventario por categoría"></div>
  </section>
  {% if g.user.role == "admin" %}
  <section class="panel stack sales">
    <h2 id="stock-title">Agregar producto</h2>
    <form id="product" class="product-form">
      <label>Producto <input name="name" maxlength="100" required></label>
      <label>Categoría del modelo <select name="category"></select></label>
      <label>Talle <input name="size" maxlength="20"></label>
      <label>Precio (ARS) <input name="price" type="number" min="0.01" max="100000000" step="0.01" required></label>
      <label>Unidades <input name="stock" type="number" min="0" max="1000000" step="1" required></label>
      <button>Guardar producto</button>
      <button type="button" class="plain" id="cancel" hidden>Cancelar</button>
    </form>
  </section>
  {% endif %}
  <section class="panel stack sales">
    <h2>Inventario</h2>
    <div id="inventory"></div>
  </section>
</main>
{% endblock %}
